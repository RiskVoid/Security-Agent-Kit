<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">RiskVoid Security Agent Kit</title>
  <desc id="d">A self-hosted AI security agent with sandboxed tools, scope enforcement, human approvals, audit log and client-ready reports.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#47B6FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#47B6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#47B6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#47B6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#47B6FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="16" fill="#14161b"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="16" fill="none" stroke="#2b2f37"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#fade)"/>

  <!-- brand -->
  <g transform="translate(64 58) scale(0.104)">
    <path fill="#47B6FF" d="M10 70 L480 70 L370 263 L318 263 L435 437 L365 437 L212 207 L340 207 L388 120 L110 120 L287 383 L252 440 Z"/>
  </g>
  <text x="124" y="91" class="mono" font-size="15" letter-spacing="3" fill="#9aa0aa">RISKVOID · OPEN SOURCE</text>

  <text x="62" y="172" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#f2f4f7">Security Agent Kit</text>
  <text x="64" y="214" class="sans" font-size="21" fill="#b9bec7">Your self-hosted AI pentester and code reviewer.</text>
  <text x="64" y="242" class="sans" font-size="21" fill="#b9bec7">Real tools, locked to the scope you authorise.</text>

  <!-- chips -->
  <g class="mono" font-size="13" fill="#d6dae0">
    <g transform="translate(64 286)">
      <rect width="150" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#47B6FF"/><text x="30" y="21">45+ tools</text>
    </g>
    <g transform="translate(224 286)">
      <rect width="168" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#5cc28c"/><text x="30" y="21">scope firewall</text>
    </g>
    <g transform="translate(402 286)">
      <rect width="168" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#e6bd5c"/><text x="30" y="21">human approval</text>
    </g>
    <g transform="translate(64 328)">
      <rect width="168" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#ea955a"/><text x="30" y="21">verified evidence</text>
    </g>
    <g transform="translate(242 328)">
      <rect width="150" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#e04b52"/><text x="30" y="21">client report</text>
    </g>
    <g transform="translate(402 328)">
      <rect width="168" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#9aa0aa"/><text x="30" y="21">runs on your box</text>
    </g>
  </g>

  <!-- live run card -->
  <g transform="translate(660 52)">
    <rect width="560" height="296" rx="12" fill="#0f1115" stroke="#2b2f37"/>
    <path d="M0 12a12 12 0 0 1 12-12h536a12 12 0 0 1 12 12v26H0z" fill="#1a1d23"/>
    <line x1="0" y1="38" x2="560" y2="38" stroke="#2b2f37"/>
    <circle cx="20" cy="19" r="5" fill="#3a3f48"/><circle cx="38" cy="19" r="5" fill="#3a3f48"/><circle cx="56" cy="19" r="5" fill="#3a3f48"/>
    <text x="280" y="24" text-anchor="middle" class="mono" font-size="12" fill="#80858f">engagement: acme-2026-11</text>

    <g class="mono" font-size="13.5">
      <text x="22" y="72" fill="#80858f">$ <tspan fill="#d6dae0">./rvkit watch</tspan></text>

      <circle cx="27" cy="103" r="4" fill="#5cc28c"/>
      <text x="42" y="108" fill="#d6dae0">semgrep --config p/python /src/app</text>
      <text x="516" y="108" text-anchor="end" fill="#5cc28c">passive</text><path d="M524 102l4 4 8-9" fill="none" stroke="#5cc28c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="27" cy="135" r="4" fill="#5cc28c"/>
      <text x="42" y="140" fill="#d6dae0">nmap --max-rate 20 -sV app.acme.test</text>
      <text x="516" y="140" text-anchor="end" fill="#5cc28c">active</text><path d="M524 134l4 4 8-9" fill="none" stroke="#5cc28c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="27" cy="167" r="4" fill="#e04b52"/>
      <text x="42" y="172" fill="#d6dae0">curl http://8.8.8.8/</text>
      <text x="516" y="172" text-anchor="end" fill="#e04b52">out of scope</text><path d="M526 162l9 9M535 162l-9 9" fill="none" stroke="#e04b52" stroke-width="2" stroke-linecap="round"/>

      <rect x="14" y="188" width="532" height="40" rx="8" fill="#e6bd5c" fill-opacity="0.10" stroke="#e6bd5c" stroke-opacity="0.45"/>
      <circle cx="27" cy="208" r="4" fill="#e6bd5c"/>
      <text x="42" y="213" fill="#f2f4f7">sqlmap -u https://app.acme.test/login</text>
      <text x="538" y="213" text-anchor="end" fill="#e6bd5c">approve? [y/N]</text>

      <line x1="14" y1="244" x2="546" y2="244" stroke="#23262d"/>
      <rect x="22" y="257" width="70" height="22" rx="5" fill="#e04b52" fill-opacity="0.16" stroke="#e04b52" stroke-opacity="0.5"/>
      <text x="57" y="273" text-anchor="middle" font-size="11.5" fill="#ff8a8f">CRITICAL</text>
      <text x="104" y="273" fill="#d6dae0">F-007 SQL injection in /login</text>
      <text x="516" y="273" text-anchor="end" fill="#80858f">sha256</text><path d="M524 267l4 4 8-9" fill="none" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
