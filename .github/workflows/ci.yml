# Fast checks on every push and pull request: lint, the compose files and unit tests. No Docker images are built,
# so a pull request gets its result in about a minute. The full stack is tested by integration.yml (on demand,
# nightly, with the full-ci label on a pull request, and before every release).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning rvkit egress/start.sh evals/*.sh kali-mcp/rv-sandbox.sh
      - name: Python compiles
        run: python3 -m compileall -q harness kali-mcp scripts colab evals
      - name: Compose file is valid
        run: |   # REDIS_PASSWORD is generated by ./rvkit; any value will do here
          cp .env.example .env && echo REDIS_PASSWORD=ci >> .env
          docker compose config -q && docker compose --profile lab config -q
      - name: Colab notebook is generated from colab/serve.py
        run: python3 colab/build_notebook.py && git diff --exit-code colab/rvkit_model_server.ipynb
      - name: VERSION matches the image tag in docker-compose.yml
        run: |
          v="$(cat VERSION)"
          n="$(grep -c "RVKIT_VERSION:-$v}" docker-compose.yml)"
          [ "$n" -ge 6 ] || { echo "docker-compose.yml image tags don't default to $v (VERSION)"; exit 1; }
      - name: Unit tests (tiers, rate caps, scope, rules, findings, web-fetch guard, console, vault, captures, authz)
        run: |   # the vault tests need cryptography (kali-mcp's venv has it)
          python3 -c 'import cryptography' 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages cryptography
          python3 evals/unit_test.py
      - name: Worker loop (scripted model, fake tools)
        run: python3 evals/worker_loop_test.py
      - name: The packet's labelled-set check (no model)
        run: python3 evals/packet_check.py
      - name: Workflow files are valid (actionlint, pinned)
        run: |   # a workflow file that doesn't parse silently disables integration and releases (it happened)
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tgz actionlint
          echo "c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4  actionlint" | shasum -c -
          ./actionlint
      - name: OAuth lab (seeded flaws and clean controls, no Docker or model)
        run: python3 evals/oauth_lab_test.py
