# Fast checks on every push and pull request: lint, the compose files and unit tests. No Docker images are built,
# so a pull request gets its result in about a minute. The full stack is tested by integration.yml (on demand,
# nightly, with the full-ci label on a pull request, and before every release).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning rvkit egress/start.sh evals/*.sh kali-mcp/rv-sandbox.sh
      - name: Python compiles
        run: python3 -m compileall -q harness kali-mcp scripts colab evals
      - name: Compose file is valid
        run: |   # REDIS_PASSWORD is generated by ./rvkit; any value will do here
          cp .env.example .env && echo REDIS_PASSWORD=ci >> .env
          docker compose config -q && docker compose --profile lab config -q
      - name: Colab notebook is generated from colab/serve.py
        run: python3 colab/build_notebook.py && git diff --exit-code colab/rvkit_model_server.ipynb
      - name: VERSION matches the image tag in docker-compose.yml
        run: |
          v="$(cat VERSION)"
          n="$(grep -c "RVKIT_VERSION:-$v}" docker-compose.yml)"
          [ "$n" -ge 6 ] || { echo "docker-compose.yml image tags don't default to $v (VERSION)"; exit 1; }
      - name: Unit tests (tiers, rate caps, scope, rules, findings, web-fetch guard, console)
        run: python3 evals/unit_test.py
