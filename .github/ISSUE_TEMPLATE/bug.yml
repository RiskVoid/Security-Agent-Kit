name: Bug
description: Something in the kit doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Run `./rvkit doctor` first; its output answers most setup problems.
        **Don't paste client data, keys, scope files or evidence.** For a security vulnerability in the kit, use
        private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands in order. A lab target (`./rvkit lab up`) is the easiest way to share a reproduction.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./rvkit doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version or commit
      placeholder: "0.1.0, or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS, OrbStack
        - macOS, Docker Desktop
        - Linux, Docker Engine
        - Linux, Docker Desktop
        - Windows (WSL2), not supported yet
        - Other
    validations:
      required: true
  - type: input
    id: worker
    attributes:
      label: Worker and planner
      placeholder: "for example: worker openrouter (DeepSeek V4.1 Flash), planner default"
