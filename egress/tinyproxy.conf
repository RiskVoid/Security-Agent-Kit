# Forward proxy for agent-canvas only (see Dockerfile). Default deny; the filter file is built by start.sh.
User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
DisableViaHeader Yes
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterCaseSensitive No
# HTTPS (CONNECT) only to port 443; plain HTTP requests are filtered by host the same way
ConnectPort 443
