# RiskVoid Security Agent Kit stack (docs/architecture.md)
#   OpenHands Agent Canvas  -> http://localhost:8000/ (through the gateway)
#   LiteLLM router          -> one endpoint for Colab / local models
#   SearXNG                 -> private web search (no API keys)
#   web-mcp                 -> web search + fetch for the planner (refuses targets and kit services)
#   kali-mcp                -> sandboxed Kali toolbox exposed as MCP (audited)
#   worker-mcp              -> delegate_task: focused tool work on the local Qwen model
#   findings-mcp            -> findings store per engagement
#   intel-mcp               -> vulnerability intelligence (OSV, NVD, EPSS, CISA KEV)
#   gateway / egress-proxy  -> agent-canvas has no internet: UI via the gateway, package registries via the proxy
# Everything binds to 127.0.0.1 only.
# Folders: client code (PROJECTS_DIR) is /src (read-only) and engagements (ENGAGEMENTS_DIR) are /work in every
# container, so a path means the same thing to the agent, the worker and the tools.

services:
  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_TAG:-1.33.0}   # pinned: ./rvkit openhands uses its API
    # No published port and no internet: it is only on the internal rvagent network. The UI is served through
    # the gateway (127.0.0.1:8000); outbound HTTP(S) goes through egress-proxy (allowlisted registries only).
    # Engagement targets are reachable only through the kali tool, which enforces the engagement scope.
    environment:
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: "true"
      LOCAL_BACKEND_API_KEY: ${OPENHANDS_API_KEY:-}   # lets ./rvkit openhands configure profiles and MCP servers
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: &noproxy localhost,127.0.0.1,litellm,web-mcp,kali-mcp,worker-mcp,findings-mcp,intel-mcp,agent-canvas
      no_proxy: *noproxy
    volumes:
      - openhands-data:/home/openhands/.openhands
      # read-only: the agent writes PLAN.md, notes and report text through the findings tools (write_file), and
      # evidence only through kali commands, so what it records can't be edited behind the audit log
      - ${PROJECTS_DIR:-~/riskvoid/projects}:/src:ro
      - ${ENGAGEMENTS_DIR:-~/riskvoid/engagements}:/work:ro
    networks: [rvagent]
    depends_on: [litellm, web-mcp, kali-mcp, worker-mcp, findings-mcp, intel-mcp, egress-proxy]
    restart: unless-stopped

  # Publishes the OpenHands UI on 127.0.0.1:8000 (agent-canvas itself is on an internal network) and serves the
  # start page at / (skips OpenHands' generic onboarding).
  gateway:
    image: caddy:${CADDY_TAG:-2.11.7-alpine}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8000}:8000"]
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/start.html:/srv/start.html:ro
    networks: [default, rvagent]
    depends_on: [agent-canvas]
    restart: unless-stopped

  # The agent container's only way out: allowlisted package registries and vulnerability databases
  # (egress/allowlist.txt + EGRESS_EXTRA_DOMAINS in .env). Not reachable from the Kali sandbox.
  egress-proxy:
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-egress:${RVKIT_VERSION:-0.1.0}
    build: ./egress
    environment:
      EGRESS_EXTRA_DOMAINS: ${EGRESS_EXTRA_DOMAINS:-}
    expose: ["3128"]
    networks: [default, rvagent]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-v1.106.2}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    env_file: .env
    # generated by ./rvkit from litellm/config.yaml + .env (budget, worker fallback); start the stack with ./rvkit up
    # rv_events.py: model-problem callback (streaming fallback, reasons in the chat); events: its log, read on the host
    volumes: ["./.rvkit/litellm.yaml:/app/config.yaml:ro", "./litellm/rv_events.py:/app/rv_events.py:ro",
              "./.rvkit/events:/rv-events"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]
    networks: [default, rvagent]
    restart: unless-stopped

  # Keeps LiteLLM's OpenRouter spend counter across LiteLLM restarts, so the daily budget holds (Valkey: BSD-3).
  redis:
    image: valkey/valkey:${VALKEY_TAG:-8.0.2-alpine}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./rvkit up (it creates REDIS_PASSWORD in .env)}
    expose: ["6379"]
    volumes: ["litellm-spend:/data"]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:${SEARXNG_TAG:-2026.10.23-629368e40}
    ports: ["127.0.0.1:${SEARXNG_PORT:-8888}:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    restart: unless-stopped

  # Web research for the planner: search (SearXNG) and fetch. fetch refuses engagement targets and non-public
  # addresses (harness/webfetch.py), so the planner can't use it to reach a target or a kit service.
  web-mcp:
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-harness:${RVKIT_VERSION:-0.1.0}
    build: ./harness
    command: ["python3", "web.py"]
    expose: ["8094"]           # OpenHands reaches it as web-mcp:8094
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on: [searxng, kali-mcp]
    networks: [default, rvagent]
    restart: unless-stopped

  kali-mcp:
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-kali:${RVKIT_VERSION:-0.1.0}
    build: ./kali-mcp
    expose: ["8090"]           # internal only; OpenHands reaches it as kali-mcp:8090
    volumes:
      - ${ENGAGEMENTS_DIR:-~/riskvoid/engagements}:/work       # scope, notes, audit log, outputs
      - ${PROJECTS_DIR:-~/riskvoid/projects}:/src:ro                     # client source code, read-only
      - kali-control:/control                                   # authoritative scope/rules/approvals/audit (root-only)
      - semgrep-rules:/opt/semgrep-rules                        # downloaded at first start (licence: not redistributable)
    environment:
      SEMGREP_RULES_COMMIT: ${SEMGREP_RULES_COMMIT:-16b9e6d45f10649f6a531ec4838ed9924372c3bc}   # 2026-10-21
    # NET_ADMIN: per-engagement firewall (nftables). SYS_ADMIN: per-command mount namespace that shows only the
    # engagement's own folder. Agent commands run as an unprivileged per-engagement user with only CAP_NET_RAW.
    cap_add: [NET_RAW, NET_ADMIN, SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
    init: true                 # reap daemonised dnsmasq / sandbox processes
    networks:
      default: {}
      rvagent: {}                         # so the OpenHands agent can call it (the sandbox firewall blocks this subnet)
      rvlab: {ipv4_address: 10.250.0.2}   # practice targets (./rvkit lab up); reachable only if in an engagement's scope
    restart: unless-stopped

  # Worker: runs focused tasks on the local Qwen model with Kali/search/fetch/file tools (Phase 2)
  worker-mcp:
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-harness:${RVKIT_VERSION:-0.1.0}
    build: ./harness
    command: ["python3", "worker.py"]
    expose: ["8091"]           # OpenHands reaches it as worker-mcp:8091
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}   # only this key; the OpenRouter key stays in litellm
      WORKER_MODEL: colab-qwen
      WORKER_CONTEXT_CHARS: ${WORKER_CONTEXT_CHARS:-90000}   # task context budget; raise for bigger model contexts
      WORKER_PARALLEL_TASKS: ${WORKER_PARALLEL_TASKS:-1}     # tasks at once; raise only if the endpoint serves parallel requests
    volumes:
      - ${ENGAGEMENTS_DIR:-~/riskvoid/engagements}:/work
      - ${PROJECTS_DIR:-~/riskvoid/projects}:/src:ro
    depends_on: [litellm, kali-mcp, intel-mcp, web-mcp]
    networks: [rvagent]        # internal only: no internet; search and fetch go through web-mcp
    restart: unless-stopped

  # Findings store (SQLite per engagement), used by the planner (Phase 2)
  findings-mcp:                # also generates the branded report (report.py)
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-report:${RVKIT_VERSION:-0.1.0}
    build: {context: ./harness, dockerfile: Dockerfile.report}
    command: ["python3", "findings.py"]
    expose: ["8092"]           # OpenHands reaches it as findings-mcp:8092
    environment:
      REPORT_BRAND: ${REPORT_BRAND:-riskvoid}   # riskvoid | plain | custom (harness/brands/example/README.md)
      ORG_NAME: ${ORG_NAME:-}                   # "Prepared by" default; plain/custom: the name in the report
    volumes:
      - ${ENGAGEMENTS_DIR:-~/riskvoid/engagements}:/work
      - ${REPORT_BRAND_FOLDER:-./harness/brands/example}:/brand-custom:ro   # used when REPORT_BRAND=custom
    networks: [default, rvagent]
    restart: unless-stopped

  # Vulnerability intelligence: OSV, NVD, EPSS, CISA KEV, cached (Phase 4)
  intel-mcp:
    image: ${RVKIT_REGISTRY:-ghcr.io/riskvoid/security-agent-kit}-harness:${RVKIT_VERSION:-0.1.0}
    build: ./harness
    command: ["python3", "intel.py"]
    expose: ["8093"]           # OpenHands reaches it as intel-mcp:8093
    environment:
      NVD_API_KEY: ${NVD_API_KEY:-}   # optional; raises NVD's rate limit (5 → 50 requests / 30 s)
    volumes: ["intel-cache:/cache"]
    networks: [default, rvagent]
    restart: unless-stopped

  # ---------------------------------------------------------------- lab (./rvkit lab up)
  # Intentionally vulnerable practice targets on an isolated network: no internet, and nothing else on it but
  # kali-mcp. Never expose these ports on the host. Images pinned (tag or digest at least two weeks old).
  lab-juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    profiles: ["lab"]
    networks: {rvlab: {ipv4_address: 10.250.0.10}}   # http://10.250.0.10:3000
    restart: "no"

  lab-vampi:   # vulnerable REST API (OWASP API Top 10)
    image: erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    profiles: ["lab"]
    environment: {vulnerable: "1", tokentimetolive: "3600"}
    networks: {rvlab: {ipv4_address: 10.250.0.13}}    # http://10.250.0.13:5000 (OpenAPI: /openapi.json)
    restart: "no"

  lab-dvga:    # vulnerable GraphQL API (amd64 image; emulated on Apple Silicon)
    image: dolevf/dvga@sha256:040aa33c199d99f3380c9ff9a1ee5d725e9abca7b189c63a35a2a73bda79c957
    platform: linux/amd64
    profiles: ["lab"]
    environment: {WEB_HOST: "0.0.0.0"}
    networks: {rvlab: {ipv4_address: 10.250.0.14}}    # http://10.250.0.14:5013/graphql
    restart: "no"

  lab-llm:     # vulnerable LLM support assistant + MCP server (simulated model, evals/targets/rv-llm-lab)
    build: ./evals/targets/rv-llm-lab
    image: riskvoid-lab-llm:local
    profiles: ["lab"]
    networks: {rvlab: {ipv4_address: 10.250.0.15}}    # http://10.250.0.15:8000  MCP: /mcp
    restart: "no"

  lab-dvwa:
    image: ghcr.io/digininja/dvwa@sha256:8029450682bd70e2e8cd1ffe8e46dd1885ff2a913296091cebfa8ba0a7d36498
    profiles: ["lab"]
    environment:
      DB_SERVER: lab-dvwa-db
      DEFAULT_SECURITY_LEVEL: low
    depends_on: [lab-dvwa-db]
    networks: {rvlab: {ipv4_address: 10.250.0.11}}   # http://10.250.0.11 (admin / password)
    restart: "no"

  lab-dvwa-db:
    image: mariadb:11.4.12
    profiles: ["lab"]
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    networks: {rvlab: {ipv4_address: 10.250.0.12}}
    restart: "no"

networks:
  rvagent:
    internal: true            # OpenHands and the services it calls; no route to the internet or the host
  rvlab:
    internal: true            # no route to the internet or the host
    ipam: {config: [{subnet: 10.250.0.0/24}]}

volumes:
  openhands-data:
  litellm-spend:
  intel-cache:
  kali-control:
  semgrep-rules:
